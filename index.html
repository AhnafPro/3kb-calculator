<!doctype html>
<style>
        body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #A0D7FF;
            overflow: hidden;
            
        }
        .calc {
            width: 280px; height: 500px; background-color: #17181af7; border-radius: 28px; overflow: hidden; box-shadow: 0px 0px 4px 0px #0000009d;
        }
        .calc:hover {
            transform: scale(1.02); transition: smooth 2s;
        }
        .keys {
           width: 9vh;
           height: 9vh; 
           padding: 4px;
           border-radius: 10px;
           background-color: #303136;
           margin-top: 12px;
           margin-left: 6px;
           margin-right: 6px;
           filter: blur(0.5px);
           border: none;
           font-size: 24px;
           font-family: "Trebuchet MS", sans-serif;
           transform-origin: top left;
           transition: transform 0.4s ease-out; 
        }

        .keys:hover {
            transform: rotateX(25deg); 
        }
</style>
